<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kool Beauty Bar · Turnos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#E8A4B8;--rose-lt:#F5D6E2;--rose-dk:#C2637A;
  --lilac:#C4A8D4;--lilac-lt:#EDE4F5;--lilac-dk:#8B5FA0;
  --sage:#A8C4A2;--sage-lt:#DFF0DB;--sage-dk:#5A8A52;
  --sky:#A4C8E0;--sky-lt:#D6ECF5;--sky-dk:#3A7FA0;
  --amber:#E8C97A;--amber-lt:#FBF3D6;--amber-dk:#B8922A;
  --bg:#FDF6FA;--surface:#fff;--text:#2D1F2E;--muted:#8A6E80;--border:rgba(196,168,212,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'DM Sans',sans-serif;font-weight:300;color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 5% 10%,rgba(232,164,184,.13) 0%,transparent 70%),radial-gradient(ellipse 50% 35% at 95% 80%,rgba(196,168,212,.11) 0%,transparent 65%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:36px 16px 80px}

/* Header */
.header{text-align:center;margin-bottom:28px}
.gems{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:10px}
.gem{width:7px;height:7px;border-radius:50%}
.gline{height:1px;width:32px;opacity:.4}
.logo{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;letter-spacing:4px;color:var(--text);margin-bottom:3px}
.logo em{font-style:italic;font-weight:400;background:linear-gradient(135deg,var(--rose-dk),var(--lilac-dk));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1.5px solid var(--border)}
.tab{flex:1;padding:11px 8px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:all .2s;text-align:center}
.tab:hover{color:var(--lilac-dk)}
.tab.active{color:var(--lilac-dk);border-bottom-color:var(--lilac-dk)}
.tab-content{display:none}.tab-content.show{display:block}

/* Card */
.card{background:var(--surface);border-radius:18px;padding:22px;border:1px solid var(--border);box-shadow:0 2px 20px rgba(196,168,212,.07);margin-bottom:14px}

/* Consulta card */
.consulta{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;transition:border-color .2s}
.consulta:hover{border-color:var(--lilac)}
.con-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.con-nombre{font-family:'Playfair Display',serif;font-size:19px;font-weight:400}
.con-sub{font-size:12px;color:var(--muted);margin-top:2px}
.badge{padding:4px 12px;border-radius:50px;font-size:11px;font-weight:500;display:inline-block}
.badge.pend{background:var(--amber-lt);color:var(--amber-dk)}
.badge.conf{background:var(--sage-lt);color:var(--sage-dk)}
.badge.aten{background:var(--lilac-lt);color:var(--lilac-dk)}

.con-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;font-size:13px}
.con-info span{color:var(--muted)}.con-info strong{color:var(--text);font-weight:500}
@media(max-width:480px){.con-info{grid-template-columns:1fr}}

/* Slot picker */
.slot-section{background:var(--lilac-lt);border-radius:12px;padding:14px;margin-bottom:14px}
.slot-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.slot-dot{width:8px;height:8px;border-radius:50%;background:var(--lilac-dk);animation:pulse 2s infinite}
.slot-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--lilac-dk);font-weight:500}
.slots-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.slot-btn{padding:7px 14px;border-radius:50px;border:1.5px solid var(--lilac);background:var(--surface);font-size:12px;font-weight:500;color:var(--lilac-dk);cursor:pointer;transition:all .18s}
.slot-btn:hover,.slot-btn.sel{background:var(--lilac-dk);color:white;border-color:var(--lilac-dk)}
.slot-manual{margin-top:8px}
.slot-manual-label{font-size:11px;color:var(--lilac-dk);margin-bottom:6px;font-weight:500}
.slot-manual-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot-manual-row input{padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;background:#fff;outline:none;transition:border-color .2s}
.slot-manual-row input:focus{border-color:var(--lilac-dk)}
.slot-manual-row input[type=date]{width:150px}
.slot-manual-row input[type=time]{width:110px}

/* Actions */
.con-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:50px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;border:none;display:inline-flex;align-items:center;gap:6px}
.btn-wa{background:#25D366;color:white}.btn-wa:hover{background:#1ebe59}
.btn-wa svg{width:15px;height:15px;fill:white}
.btn-confirmar{background:var(--sage-lt);color:var(--sage-dk);border:1.5px solid var(--sage)}.btn-confirmar:hover{background:var(--sage-dk);color:white}
.btn-atendido{background:var(--lilac-lt);color:var(--lilac-dk);border:1.5px solid var(--lilac)}.btn-atendido:hover{background:var(--lilac-dk);color:white}
.btn-sm{padding:6px 12px;font-size:11px}

/* Agenda */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.week-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:400}
.week-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:15px;color:var(--muted);transition:all .2s;display:flex;align-items:center;justify-content:center}
.week-btn:hover{border-color:var(--lilac-dk);color:var(--lilac-dk)}

.agenda-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:600px){.agenda-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:380px){.agenda-grid{grid-template-columns:repeat(2,1fr)}}

.dia-col{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;min-height:100px}
.dia-col.hoy{border-color:var(--lilac-dk)}
.dia-col.cerrado{opacity:.4}
.dia-head{padding:9px 10px;text-align:center;border-bottom:1px solid var(--border)}
.dia-col.hoy .dia-head{background:var(--lilac-lt)}
.dia-n{font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.dia-col.hoy .dia-n{color:var(--lilac-dk)}
.dia-num{font-family:'Playfair Display',serif;font-size:20px;color:var(--lilac-dk)}
.dia-hs{font-size:9px;color:var(--muted);margin-top:1px}
.dia-body{padding:7px}
.t-bloque{background:var(--rose-lt);border-left:3px solid var(--rose-dk);border-radius:7px;padding:6px 8px;margin-bottom:6px;font-size:11px}
.t-hora{font-weight:500;color:var(--rose-dk)}
.t-quien{color:var(--text);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-serv{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dia-vacio{padding:10px 7px;text-align:center;font-size:10px;color:var(--muted);font-style:italic}
.t-libre{background:rgba(168,196,162,.15);border:1.5px dashed var(--sage);border-radius:7px;padding:5px 8px;margin-bottom:5px;cursor:pointer;transition:all .2s;text-align:center}
.t-libre:hover{background:var(--sage-lt);border-color:var(--sage-dk)}
.t-hora-libre{font-size:10px;font-weight:500;color:var(--sage-dk)}
.t-libre-txt{font-size:9px;color:var(--sage-dk)}

/* Form fields */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fg{grid-template-columns:1fr}}
.f{margin-bottom:0}
.f label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text);font-weight:500;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;background:#FAFAFA;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;appearance:none;-webkit-appearance:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--lilac-dk)}
.sw{position:relative}.sw::after{content:'↓';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--lilac-dk);pointer-events:none;font-size:11px}
.save-btn{margin-top:16px;padding:12px 28px;background:linear-gradient(135deg,var(--rose-dk),var(--lilac-dk));color:white;border:none;border-radius:50px;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:500;cursor:pointer;transition:all .25s}
.save-btn:hover{opacity:.85;transform:translateY(-1px)}

/* Tiempos */
.tg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.tg{grid-template-columns:1fr}}
.ti label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--text);font-weight:500;display:block;margin-bottom:5px}
.ti-row{display:flex;align-items:center;gap:8px}
.ti-row input{width:75px;padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;text-align:center;outline:none;font-family:'DM Sans',sans-serif}
.ti-row input:focus{border-color:var(--lilac-dk)}
.ti-row span{font-size:12px;color:var(--muted)}

/* Section label */
.sl{font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sl.rose{color:var(--rose-dk)}.sl.rose::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(194,99,122,.2),transparent)}
.sl.lilac{color:var(--lilac-dk)}.sl.lilac::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(139,95,160,.2),transparent)}
.sl.sage{color:var(--sage-dk)}.sl.sage::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(90,138,82,.2),transparent)}
.sl.amber{color:var(--amber-dk)}.sl.amber::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(184,146,42,.2),transparent)}

/* Empty / loading */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty-icon{font-size:32px;margin-bottom:10px}
.empty-txt{font-family:'Playfair Display',serif;font-style:italic;font-size:16px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--text);color:white;padding:11px 22px;border-radius:50px;font-size:13px;transition:transform .3s;z-index:200;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="gems">
      <div class="gline" style="background:linear-gradient(90deg,var(--rose),var(--lilac))"></div>
      <div class="gem" style="background:var(--rose)"></div>
      <div class="gem" style="background:var(--lilac)"></div>
      <div class="gem" style="background:var(--sage)"></div>
      <div class="gem" style="background:var(--sky)"></div>
      <div class="gline" style="background:linear-gradient(90deg,var(--sky),var(--sage))"></div>
    </div>
    <div class="logo">KOOL <em>beauty</em> bar</div>
    <div class="subtitle">Panel de turnos</div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="goTab('pendientes')">📋 Pendientes</div>
    <div class="tab" onclick="goTab('agenda')">📅 Agenda</div>
    <div class="tab" onclick="goTab('nuevo')">➕ Nuevo turno</div>
    <div class="tab" onclick="goTab('config')">⚙️ Tiempos</div>
  </div>

  <!-- PENDIENTES -->
  <div class="tab-content show" id="tab-pendientes">
    <div id="lista"></div>
  </div>

  <!-- AGENDA -->
  <div class="tab-content" id="tab-agenda">
    <div class="week-nav">
      <button class="week-btn" onclick="semana(-1)">←</button>
      <div class="week-title" id="week-title"></div>
      <button class="week-btn" onclick="semana(1)">→</button>
    </div>
    <div class="agenda-grid" id="agenda-grid"></div>
  </div>

  <!-- NUEVO TURNO -->
  <div class="tab-content" id="tab-nuevo">
    <div class="card">
      <div class="sl rose">Agregar turno</div>
      <div class="fg">
        <div class="f"><label>Nombre</label><input type="text" id="nt-nombre" placeholder="Nombre de la clienta"></div>
        <div class="f"><label>WhatsApp</label><input type="tel" id="nt-wa" placeholder="Ej: 2284 123456"></div>
        <div class="f"><label>Servicio</label><div class="sw"><select id="nt-serv"><option value="">— Elegí —</option><option>Corte</option><option>Corte y tratamiento</option><option>Color</option><option>Color en raíces</option><option>Color en cabello completo</option><option>Corte y color</option><option>Mechas</option><option>Tratamiento</option></select></div></div>
        <div class="f"><label>Fecha</label><input type="date" id="nt-fecha"></div>
        <div class="f"><label>Hora</label><input type="time" id="nt-hora"></div>
        <div class="f"><label>Estado</label><div class="sw"><select id="nt-estado"><option value="Confirmado">Confirmado</option><option value="Pendiente">Pendiente</option></select></div></div>
      </div>
      <div class="f" style="margin-top:12px"><label>Nota <span style="font-weight:300;text-transform:none;letter-spacing:0;font-size:11px;color:var(--muted)">· opcional</span></label><textarea id="nt-nota" rows="2" placeholder="Algo a tener en cuenta..."></textarea></div>
      <button class="save-btn" onclick="guardarTurno()">Guardar turno</button>
    </div>
  </div>

  <!-- CONFIG -->
  <div class="tab-content" id="tab-config">
    <div class="card">
      <div class="sl lilac">Duración por servicio (minutos)</div>
      <div class="tg" id="tg"></div>
      <button class="save-btn" onclick="guardarTiempos()">Guardar</button>
    </div>
    <div class="card">
      <div class="sl amber">Tus horarios</div>
      <div style="font-size:13px;line-height:2.1;color:var(--muted)">
        🟣 <strong style="color:var(--text)">Lun / Mié / Vie</strong> · 13:30 — 16:30 hs<br>
        🟣 <strong style="color:var(--text)">Mar / Jue</strong> · 14:00 — 20:00 hs<br>
        🟡 <strong style="color:var(--text)">Sábado</strong> · 9:30 — 14:30 hs (opcional)<br>
        ⚪ <strong style="color:var(--text)">Dom / días sin horario</strong> · Cerrado
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzJafO8D0ad3OtUG42AIIxm_UN8CTmz3Ff2cx31QPajD7M3CkLqbK2VdPMrLLxrc14/exec';
const KEY = 'kool2026';

// ── TIEMPOS ────────────────────────────────────────────────────
let tiempos = JSON.parse(localStorage.getItem('kool_t')||'null') || {
  'Corte':30,'Corte y tratamiento':60,'Color':120,
  'Color en raíces':90,'Color en cabello completo':120,
  'Corte y color':150,'Mechas':150,'Tratamiento':60
};

// ── HORARIOS ───────────────────────────────────────────────────
const hs = {
  1:{i:'13:30',f:'16:30'},3:{i:'13:30',f:'16:30'},5:{i:'13:30',f:'16:30'},
  2:{i:'14:00',f:'20:00'},4:{i:'14:00',f:'20:00'},6:{i:'09:30',f:'14:30'}
};

// ── TABS ───────────────────────────────────────────────────────
const tabNames = ['pendientes','agenda','nuevo','config'];
function goTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', tabNames[i]===name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('show'));
  document.getElementById('tab-'+name).classList.add('show');
  if (name==='pendientes') cargarConsultas();
  if (name==='agenda')     renderAgenda();
  if (name==='config')     renderTiempos();
}

// ── CONSULTAS ─────────────────────────────────────────────────
let consultas = [];
async function cargarConsultas() {
  const lista = document.getElementById('lista');
  lista.innerHTML = `<div class="empty"><div class="empty-icon" style="animation:pulse 1.5s infinite">✦</div><div class="empty-txt">Cargando...</div></div>`;
  try {
    const r = await fetch(`${SHEETS_URL}?action=getConsultas&key=${KEY}`);
    const data = await r.json();
    function col(row,...ns){
      const ks=Object.keys(row);
      for(const n of ns){const f=ks.find(k=>k.trim().toLowerCase()===n.toLowerCase());if(f)return String(row[f]||'').trim();}
      return '';
    }
    consultas = data.map(row=>({
      nombre:  col(row,'nombre'),
      wa:      col(row,'whatsapp'),
      servicio:col(row,'servicio'),
      largo:   col(row,'largo cabello','largo'),
      rulo:    col(row,'tipo de rulo'),
      primera: col(row,'primera vez'),
      dias:    col(row,'días disponibles','dias disponibles'),
      nota:    col(row,'comentarios','nota'),
      fecha:   col(row,'fecha'),
      estado:  col(row,'turno dado?','estado')||'Pendiente',
    })).filter(c=>c.nombre);
  } catch(e) {
    lista.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-txt">No se pudo conectar con el Sheet.<br>Revisá tu conexión.</div></div>`;
    return;
  }
  renderConsultas();
}

// Estado seleccionado de slot por consulta
const slotSel = {};

function renderConsultas() {
  const lista = document.getElementById('lista');
  const pend = consultas.filter(c => c.estado.toLowerCase().includes('pendiente'));
  if (!pend.length) {
    lista.innerHTML = `<div class="empty"><div class="empty-icon">✦</div><div class="empty-txt">No hay consultas pendientes 🎉</div></div>`;
    return;
  }
  lista.innerHTML = pend.map((c,i) => {
    const {min, slots} = sugerirSlots(c);
    const slotsHtml = slots.length
      ? slots.map(s=>`<button class="slot-btn" onclick="selSlot(${i},'${s.label}','${s.fecha}','${s.hora}',this)">${s.label}</button>`).join('')
      : `<span style="font-size:12px;color:var(--muted)">Sin slots en sus días — usá el horario manual</span>`;
    return `
    <div class="consulta" id="con-${i}">
      <div class="con-top">
        <div>
          <div class="con-nombre">${c.nombre}</div>
          <div class="con-sub">✂️ ${c.servicio} &nbsp;·&nbsp; 📱 ${c.wa}</div>
        </div>
        <span class="badge pend">Pendiente</span>
      </div>
      <div class="con-info">
        <span>💇 <strong>${c.largo||'—'}</strong> · ${c.rulo||'—'}</span>
        <span>📅 Prefiere: <strong>${c.dias||'—'}</strong></span>
        ${c.primera.includes('primera')?`<span style="grid-column:1/-1">⭐ <strong>Primera vez en Kool</strong></span>`:''}
        ${c.nota&&c.nota!=='—'?`<span style="grid-column:1/-1">📝 ${c.nota}</span>`:''}
      </div>

      <div class="slot-section">
        <div class="slot-header"><div class="slot-dot"></div><div class="slot-title">IA · ${min} min estimados · elegí un slot</div></div>
        <div class="slots-row">${slotsHtml}</div>
        <div class="slot-manual">
          <div class="slot-manual-label">O ingresá un horario manual:</div>
          <div class="slot-manual-row">
            <input type="date" id="md-${i}" value="${new Date().toISOString().split('T')[0]}">
            <input type="time" id="mh-${i}" value="13:30">
            <button class="btn btn-sm" style="background:var(--lilac-lt);color:var(--lilac-dk);border:1.5px solid var(--lilac)" onclick="usarManual(${i})">Usar este</button>
          </div>
        </div>
      </div>

      <div class="con-actions">
        <button class="btn btn-wa" onclick="abrirWA(${i})">
          <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Escribir a ${c.nombre.split(' ')[0]}
        </button>
        <button class="btn btn-confirmar" onclick="confirmarTurno(${i})">✓ Confirmar turno</button>
        <button class="btn btn-atendido" onclick="marcarAtendida(${i})">Atendida</button>
      </div>
    </div>`;
  }).join('');
}

// ── SUGERIR SLOTS ──────────────────────────────────────────────
let turnosGuardados = [];
function sugerirSlots(c) {
  const min = tiempos[c.servicio] || 60;
  const diasPref = (c.dias||'').split(',').map(d=>d.trim()).filter(Boolean);
  const slots = [];
  const hoy = new Date();
  for (let off=0; off<21 && slots.length<3; off++) {
    const d = new Date(hoy); d.setDate(hoy.getDate()+off);
    const dow = d.getDay();
    if (!hs[dow]) continue;
    const nomDia = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][dow];
    if (diasPref.length && !diasPref.some(dp=>dp.toLowerCase()===nomDia.toLowerCase())) continue;
    const [hI,mI] = hs[dow].i.split(':').map(Number);
    const [hF,mF] = hs[dow].f.split(':').map(Number);
    const fechaStr = d.toISOString().split('T')[0];
    const tdDia = turnosGuardados.filter(t=>t.fecha===fechaStr);
    let cur = hI*60+mI;
    while (cur+min <= hF*60+mF && slots.length<3) {
      const ocup = tdDia.some(t=>{
        const [th,tm]=t.hora.split(':').map(Number);
        const ti=th*60+tm, tf=ti+(tiempos[t.servicio]||60);
        return cur<tf && cur+min>ti;
      });
      if (!ocup) {
        const hh=String(Math.floor(cur/60)).padStart(2,'0'),mm=String(cur%60).padStart(2,'0');
        const fl=d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
        slots.push({label:`${fl} ${hh}:${mm}`,fecha:fechaStr,hora:`${hh}:${mm}`});
      }
      cur+=30;
    }
  }
  return {min, slots};
}

function selSlot(i, label, fecha, hora, btn) {
  slotSel[i] = {label,fecha,hora};
  document.querySelectorAll(`#con-${i} .slot-btn`).forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

function usarManual(i) {
  const fecha = document.getElementById(`md-${i}`).value;
  const hora  = document.getElementById(`mh-${i}`).value;
  if (!fecha||!hora) { toast('Completá fecha y hora'); return; }
  const d = new Date(fecha);
  const label = d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'})+' '+hora;
  slotSel[i] = {label,fecha,hora};
  document.querySelectorAll(`#con-${i} .slot-btn`).forEach(b=>b.classList.remove('sel'));
  toast('✦ Horario manual listo — ahora confirmá el turno');
}

// ── WHATSAPP ───────────────────────────────────────────────────
function abrirWA(i) {
  const c = consultas.filter(x=>x.estado.toLowerCase().includes('pendiente'))[i];
  const s = slotSel[i];
  const fn = c.nombre.split(' ')[0];
  const msg = s
    ? `¡Hola ${fn}! 💜 Te escribimos desde Kool Beauty Bar.\n\nTenemos un lugar para tu *${c.servicio}* el *${s.label} hs*.\n\n¿Te queda bien? ✨`
    : `¡Hola ${fn}! 💜 Te escribimos desde Kool Beauty Bar.\n\nRecibimos tu consulta para *${c.servicio}*. ¿Cuándo te quedaría mejor? 🌸`;
  const num = c.wa.replace(/\D/g,'');
  const full = num.startsWith('54')?num:'549'+num;
  window.open(`https://wa.me/${full}?text=${encodeURIComponent(msg)}`,'_blank');
}

// ── CONFIRMAR TURNO ────────────────────────────────────────────
function confirmarTurno(i) {
  const c = consultas.filter(x=>x.estado.toLowerCase().includes('pendiente'))[i];
  const s = slotSel[i];
  if (!s) { toast('⚠ Primero elegí un slot o ingresá un horario manual'); return; }
  enviarASheets({
    tipo:'turno', nombre:c.nombre, whatsapp:c.wa,
    servicio:c.servicio, fecha:s.fecha, hora:s.hora,
    duracion: tiempos[c.servicio]||60, estado:'Confirmado', nota:c.nota||''
  });
  enviarASheets({
    tipo:'actualizarEstadoConsulta', nombre:c.nombre,
    whatsapp:c.wa, nuevoEstado:'Confirmado'
  });
  turnosGuardados.push({nombre:c.nombre,wa:c.wa,servicio:c.servicio,fecha:s.fecha,hora:s.hora,estado:'Confirmado'});
  localStorage.setItem('kool_turnos', JSON.stringify(turnosGuardados));
  consultas.filter(x=>x.estado.toLowerCase().includes('pendiente'))[i].estado='Confirmado';
  toast(`✦ Turno de ${c.nombre.split(' ')[0]} confirmado para ${s.label}`);
  renderConsultas();
}

function marcarAtendida(i) {
  const c = consultas.filter(x=>x.estado.toLowerCase().includes('pendiente'))[i];
  enviarASheets({tipo:'actualizarEstadoConsulta',nombre:c.nombre,whatsapp:c.wa,nuevoEstado:'Atendido'});
  consultas.filter(x=>x.estado.toLowerCase().includes('pendiente'))[i].estado='Atendido';
  toast(`✦ ${c.nombre.split(' ')[0]} marcada como atendida`);
  renderConsultas();
}

// ── AGENDA ─────────────────────────────────────────────────────
let semOff = 0;
function semana(d) { semOff+=d; renderAgenda(); }

async function renderAgenda() {
  // Cargar turnos del Sheet + los locales
  try {
    const r = await fetch(`${SHEETS_URL}?action=getTurnos&key=${KEY}`);
    const data = await r.json();
    turnosGuardados = data.map(row=>{
      // Normalizar fecha — puede venir como "2026-05-10T03:00:00.000Z" o "10/5/2026" o "2026-05-10"
      let fecha = String(row['Fecha']||'').trim();
      if (fecha.includes('T')) fecha = fecha.split('T')[0]; // ISO → solo fecha
      else if (fecha.includes('/')) {
        const [d,m,y] = fecha.split('/');
        fecha = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
      }
      return {
        nombre: row['Nombre']||'', wa: row['WhatsApp']||'',
        servicio: row['Servicio']||'', fecha,
        hora: row['Hora']||'', estado: row['Estado']||'Confirmado'
      };
    }).filter(t=>t.nombre);
    localStorage.setItem('kool_turnos', JSON.stringify(turnosGuardados));
  } catch(e) {
    turnosGuardados = JSON.parse(localStorage.getItem('kool_turnos')||'[]');
  }

  const hoy = new Date();
  const lun = new Date(hoy);
  lun.setDate(hoy.getDate() - (hoy.getDay()||7) + 1 + semOff*7);

  const dias = Array.from({length:7},(_,i)=>{ const d=new Date(lun); d.setDate(lun.getDate()+i); return d; });
  const p = dias[0].toLocaleDateString('es-AR',{day:'numeric',month:'long'});
  const u = dias[6].toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('week-title').textContent = `${p} — ${u}`;

  const ns=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  document.getElementById('agenda-grid').innerHTML = dias.map(d=>{
    const dow=d.getDay(), esHoy=d.toDateString()===hoy.toDateString();
    const fStr=d.toISOString().split('T')[0];
    const tdDia=turnosGuardados.filter(t=>t.fecha===fStr);
    // Armar bloques de turnos + slots libres intercalados
    const sorted = tdDia.sort((a,b)=>a.hora.localeCompare(b.hora));
    let tHtml = '';
    if (!hs[dow]) {
      tHtml = `<div class="dia-vacio">Cerrado</div>`;
    } else {
      const [hI,mI]=hs[dow].i.split(':').map(Number);
      const [hF,mF]=hs[dow].f.split(':').map(Number);
      let cur=hI*60+mI;
      const fin=hF*60+mF;
      // Marcar minutos ocupados
      const ocup=[];
      sorted.forEach(t=>{
        const [th,tm]=t.hora.split(':').map(Number);
        const d=tiempos[t.servicio]||60;
        for(let x=th*60+tm;x<th*60+tm+d;x++) ocup.push(x);
      });
      // Primero mostrar turnos confirmados
      sorted.forEach(t=>{
        tHtml+=`<div class="t-bloque" title="${t.nombre} · ${t.servicio}">
          <div class="t-hora">${t.hora} hs</div>
          <div class="t-quien">${t.nombre}</div>
          <div class="t-serv">${t.servicio}</div>
        </div>`;
      });
      // Luego slots libres de 30 min
      let libreCount=0;
      while(cur<fin && libreCount<4){
        if(!ocup.includes(cur)){
          const hh=String(Math.floor(cur/60)).padStart(2,'0'),mm=String(cur%60).padStart(2,'0');
          tHtml+=`<div class="t-libre" onclick="irANuevoTurno('${fStr}','${hh}:${mm}')">
            <div class="t-hora-libre">${hh}:${mm}</div>
            <div class="t-libre-txt">+ Disponible</div>
          </div>`;
          libreCount++;
        }
        cur+=30;
      }
      if(!tHtml) tHtml=`<div class="dia-vacio">Sin turnos</div>`;
    }
    return `
    <div class="dia-col ${esHoy?'hoy':''} ${!hs[dow]?'cerrado':''}">
      <div class="dia-head">
        <div class="dia-n">${ns[dow]}</div>
        <div class="dia-num">${d.getDate()}</div>
        <div class="dia-hs">${hs[dow]?hs[dow].i+' — '+hs[dow].f:'—'}</div>
      </div>
      <div class="dia-body">${tHtml}</div>
    </div>`;
  }).join('');
}

// ── NUEVO TURNO MANUAL ─────────────────────────────────────────
function guardarTurno() {
  const n=document.getElementById('nt-nombre').value.trim();
  const w=document.getElementById('nt-wa').value.trim();
  const s=document.getElementById('nt-serv').value;
  const f=document.getElementById('nt-fecha').value;
  const h=document.getElementById('nt-hora').value;
  const e=document.getElementById('nt-estado').value;
  const nota=document.getElementById('nt-nota').value.trim();
  if (!n||!s||!f||!h){toast('⚠ Completá nombre, servicio, fecha y hora');return;}
  enviarASheets({tipo:'turno',nombre:n,whatsapp:w,servicio:s,fecha:f,hora:h,duracion:tiempos[s]||60,estado:e,nota});
  turnosGuardados.push({nombre:n,wa:w,servicio:s,fecha:f,hora:h,estado:e});
  localStorage.setItem('kool_turnos',JSON.stringify(turnosGuardados));
  ['nt-nombre','nt-wa','nt-fecha','nt-hora','nt-nota'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('nt-serv').value='';
  toast('✦ Turno guardado');
  goTab('agenda');
}

// ── TIEMPOS ────────────────────────────────────────────────────
function renderTiempos() {
  document.getElementById('tg').innerHTML = Object.entries(tiempos).map(([s,m])=>`
    <div class="ti">
      <label>${s}</label>
      <div class="ti-row">
        <input type="number" id="ti-${s.replace(/ /g,'_')}" value="${m}" min="15" step="15">
        <span>min</span>
      </div>
    </div>`).join('');
}
function guardarTiempos() {
  Object.keys(tiempos).forEach(s=>{
    const el=document.getElementById('ti-'+s.replace(/ /g,'_'));
    if(el) tiempos[s]=parseInt(el.value)||tiempos[s];
  });
  localStorage.setItem('kool_t',JSON.stringify(tiempos));
  toast('✦ Tiempos guardados');
}

// ── ENVÍO A SHEETS ─────────────────────────────────────────────
function enviarASheets(data) {
  try {
    // Encode as URL params and POST via fetch no-cors with text/plain
    // (text/plain bypasses CORS preflight unlike application/json)
    const params = new URLSearchParams();
    for(const[k,v] of Object.entries(data)) params.append(k, v);
    fetch(SHEETS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain'},
      body: params.toString()
    }).catch(()=>{});
  } catch(e){}
}

// ── TOAST ──────────────────────────────────────────────────────
function toast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ── IR A NUEVO TURNO CON FECHA/HORA PRECOMPLETADA ─────────────
function irANuevoTurno(fecha, hora) {
  document.getElementById('nt-fecha').value = fecha;
  document.getElementById('nt-hora').value  = hora;
  goTab('nuevo');
  toast('✦ Completá el nombre y servicio para confirmar');
}

// ── INIT ───────────────────────────────────────────────────────
turnosGuardados = JSON.parse(localStorage.getItem('kool_turnos')||'[]');
document.getElementById('nt-fecha').value = new Date().toISOString().split('T')[0];
cargarConsultas();
</script>
